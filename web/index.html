<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>xiaoji: ART in a Web Worker</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 2em; max-width: 60em; }
  pre { background: #f4f4f4; padding: 0.75em; min-height: 2em; white-space: pre-wrap; }
  table { border-collapse: collapse; }
  td { padding: 0.15em 1em 0.15em 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>xiaoji: ART in a Web Worker</h1>
<p>
  <label>Case
    <select id="case">
      <option value="hello-jit">hello-jit: translator on</option>
      <option value="hello-int">hello-int: interpreter only (-Xint)</option>
    </select>
  </label>
  <button id="run">Run</button>
  <span id="status">idle</span>
</p>
<h3>stdout</h3>
<pre id="out"></pre>
<h3>stderr</h3>
<pre id="err"></pre>
<h3>Timings</h3>
<table id="timing"></table>
<script type="module" src="./main.js"></script>
</body>
</html>
